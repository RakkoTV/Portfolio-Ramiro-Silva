<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SocialManager</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e9edf5);
        }
        
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .register-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .register-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .register-header p {
            color: #7f8c8d;
        }
        
        .register-form .form-group {
            margin-bottom: 20px;
        }
        
        .register-form .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }
        
        .register-form .form-group input,
        .register-form .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }
        
        .register-form .form-group input:focus,
        .register-form .form-group select:focus {
            outline: none;
            border-color: #6e8efb;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .terms {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .terms input {
            margin-right: 10px;
            margin-top: 5px;
        }
        
        .terms label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        .terms label a {
            color: #6e8efb;
            font-weight: 500;
        }
        
        .register-form button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .register-form button:hover {
            background: linear-gradient(135deg, #5d7df9, #9566d9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
        }
        
        .social-register {
            margin-top: 30px;
            text-align: center;
        }
        
        .social-register p {
            margin-bottom: 15px;
            color: #7f8c8d;
            position: relative;
        }
        
        .social-register p::before,
        .social-register p::after {
            content: "";
            display: inline-block;
            width: 30%;
            height: 1px;
            background-color: #ddd;
            position: absolute;
            top: 50%;
        }
        
        .social-register p::before {
            left: 0;
        }
        
        .social-register p::after {
            right: 0;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .social-icons a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .social-icons a.facebook {
            background-color: #3b5998;
        }
        
        .social-icons a.google {
            background-color: #db4437;
        }
        
        .social-icons a.twitter {
            background-color: #1da1f2;
        }
        
        .social-icons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .login-link a {
            color: #6e8efb;
            font-weight: 500;
        }
        
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #2c3e50;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-to-home:hover {
            color: #6e8efb;
        }
        
        @media (max-width: 576px) {
            .register-card {
                padding: 30px 20px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .social-register p::before,
            .social-register p::after {
                width: 25%;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
    
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>SocialManager</h1>
                <p>Crea tu cuenta</p>
            </div>
            
            <div id="register-alert" class="alert"></div>
            
            <form class="register-form" id="register-form">
                <input type="hidden" name="action" value="register">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">Nombre</label>
                        <input type="text" id="first-name" name="first_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last-name">Apellido</label>
                        <input type="text" id="last-name" name="last_name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm_password" required>
                </div>
                
                <div class="form-group">
                    <label for="plan">Selecciona un plan</label>
                    <select id="plan" name="plan" required>
                        <option value="">Selecciona un plan</option>
                        <option value="basic">Básico - €9/mes</option>
                        <option value="professional">Profesional - €19/mes</option>
                        <option value="business">Empresarial - €39/mes</option>
                    </select>
                </div>
                
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">He leído y acepto los <a href="terminos.html">Términos de Servicio</a> y la <a href="privacidad.html">Política de Privacidad</a>.</label>
                </div>
                
                <button type="submit">Crear Cuenta</button>
            </form>
            
            <div class="social-register">
                <p>O regístrate con</p>
                
                <div class="social-icons">
                    <a href="#" class="facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                </div>
            </div>
            
            <div class="login-link">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>
    
    <style>
        .alert {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
    
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validar que las contraseñas coincidan
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('register-alert');
            
            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Las contraseñas no coinciden';
                alertBox.style.display = 'block';
                return;
            }
            
            const formData = new FormData(this);
            
            fetch('php/auth.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Mostrar mensaje de éxito
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = '¡Cuenta creada con éxito! Redirigiendo...';
                    alertBox.style.display = 'block';
                    
                    // Redirigir al dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    // Mostrar mensaje de error
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.message || 'Error al crear la cuenta. Inténtalo de nuevo.';
                    alertBox.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Error de conexión. Inténtalo de nuevo más tarde.';
                alertBox.style.display = 'block';
            });
        });
    </script>
</body>
</html>
