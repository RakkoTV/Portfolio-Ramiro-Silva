<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor de Audio y Generador de Estudios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Transcriptor de Audio y Generador de Estudios</h1>
        </header>

        <main>
            <section class="audio-section">
                <h2>Grabación de Audio</h2>
                <div class="controls">
                    <select id="language-select">
                        <option value="es-ES">Español</option>
                        <option value="en-US">English</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                    </select>
                    <button id="startRecord" class="btn primary">Iniciar Grabación</button>
                    <button id="stopRecord" class="btn secondary" disabled>Detener Grabación</button>
                </div>
                <div class="audio-status">
                    <span id="recording-status">No grabando</span>
                </div>
                <div class="audio-upload">
                    <label for="audio-file-input" class="btn secondary">Subir archivo de audio</label>
                    <input type="file" id="audio-file-input" accept=".mp3,.wav,.flac" style="display: none;">
                </div>
                <div class="audio-player-container">
                    <audio id="audio-player" controls style="display: none; width: 100%; margin-top: 10px;"></audio>
                </div>
            </section>

            <section class="transcription-section">
                <h2>Transcripción</h2>
                <div class="transcription-container">
                    <div class="progress-bar">
                        <div id="transcription-progress" class="progress"></div>
                    </div>
                    <textarea id="transcription-text" readonly placeholder="La transcripción aparecerá aquí..."></textarea>
                </div>
                <button id="generate-study" class="btn primary" disabled>Generar Documento de Estudio</button>
            </section>

            <section class="study-section">
                <h2>Documento de Estudio</h2>
                <div class="study-container">
                    <div id="study-document" class="study-content"></div>
                </div>
                <button id="download-study" class="btn secondary" disabled>Descargar Documento</button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
